name: Bunny Edge Deploy
description: Deploy the build a Bunny framework adapter describes in .bunny/build.json. Client files go to a Bunny Storage folder per deploy, the server bundle runs as the standalone edge script behind a CDN pull zone.
author: De Voorhoede
branding:
  icon: upload-cloud
  color: orange

inputs:
  build-manifest:
    description: Path to the build manifest the adapter writes, for example `@bunny.net/astro-adapter`. The script entry and client dir it names are resolved from the directory above `.bunny/`.
    default: .bunny/build.json
  bunny-api-key:
    description: Bunny.net account API key. Pass it as a secret.
    required: true
  env:
    description: Runtime environment variables to set on the edge script, one KEY=value per line. Only listed keys are set or updated; nothing is removed. Variables can also be managed in the Bunny dashboard. Names the action sets from the zones, such as `BUNNY_STORAGE_KEY`, are not allowed.
    default: ""
  secrets:
    description: Encrypted secrets to set on the edge script, one KEY=value per line. Only listed keys are set; nothing is removed. Values are masked in logs and never read back.
    default: ""
  name:
    description: Base name for the storage zone, pull zone and script. Defaults to the repository name, lowercased, with anything outside a-z, 0-9 and dashes replaced by a dash. The pull zone name becomes the `<name>.b-cdn.net` hostname and must be unique across Bunny.
    default: ""
  storage-zone-name:
    description: Overrides the storage zone name.
    default: ""
  pull-zone-name:
    description: Overrides the pull zone name.
    default: ""
  script-name:
    description: Overrides the edge script name.
    default: ""
  storage-region:
    description: Main storage region code, used when the storage zone is created. DE is Frankfurt. Cannot be changed afterwards.
    default: DE
  storage-tier:
    description: "`standard` (HDD, $0.01/GB) or `edge` (SSD, $0.02/GB, requires DE), used when the storage zone is created. Cannot be changed afterwards."
    default: standard
  replication-regions:
    description: Comma-separated replication region codes, used when the storage zone is created. Each region costs extra and cannot be removed after it is added.
    default: ""
  pricing-tier:
    description: "`standard` (full network, EU $0.01/GB) or `volume` (10 PoPs, no Amsterdam, $0.005/GB), used when the pull zone is created. Change it in the dashboard afterwards."
    default: standard
  pricing-regions:
    description: Comma-separated CDN pricing regions to enable when the pull zone is created, from EU, US, ASIA, SA, AF. Visitors in a disabled region are served from the nearest enabled one. Change them in the dashboard afterwards.
    default: EU
  monthly-bandwidth-limit-gb:
    description: Monthly bandwidth limit in GB as a cost guard, set when the pull zone is created. 0 means unlimited. The zone stops serving when the limit is reached.
    default: "0"
  stale-while-updating:
    description: Serve the cached response while a fresh one is fetched in the background, set when the pull zone is created. Serves the previous version once after each purge.
    default: "false"
  script-size-limit-mb:
    description: Fail when the script is larger than this. Bunny documents 10 MB, but scripts of 9.5 MB and up failed to boot reliably in testing.
    default: "8"
  startup-limit-ms:
    description: Fail when importing the script in a local Deno harness takes longer than this. Only runs when `deno` is on the PATH.
    default: "500"
  smoke-route:
    description: Server-rendered route requested by the smoke test after the deploy.
    default: /
  smoke-static-path:
    description: Static file path requested by the smoke test. Defaults to the first hashed asset in the client dir, else its first file.
    default: ""
  concurrency:
    description: Parallel storage uploads.
    default: "8"
  release-note:
    description: Note stored on the published script release. Defaults to repository, commit and run number.
    default: ""

outputs:
  hostname:
    description: The pull zone system hostname, `<name>.b-cdn.net`.
  release:
    description: ID of the published script release. Publishing it again rolls back code and files together, while its deploy folder is kept.
  deploy-id:
    description: Content hash of this build; its client files are in `deploys/<deploy-id>/` in the storage zone.
  pull-zone-id:
    description: Bunny pull zone ID.
  storage-zone-id:
    description: Bunny storage zone ID.
  script-id:
    description: Bunny edge script ID.

runs:
  using: node24
  main: src/main.js
